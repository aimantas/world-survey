<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Off the map · World Survey</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<style>
  @font-face { font-family: 'Archivo Variable'; font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; src: url(/assets/fonts/archivo-latin-wdth-normal.woff2) format('woff2-variations'); }
  @font-face { font-family: 'Source Serif 4 Variable'; font-style: italic; font-weight: 200 900; font-display: swap; src: url(/assets/fonts/source-serif-4-latin-wght-italic.woff2) format('woff2-variations'); }
  :root { --paper: #f4f5f0; --ink: #1b232b; --ink-2: #48525c; --overprint: #c3177b; --water-ink: #2a6893; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--paper); color: var(--ink); font: 400 16px/1.5 'Archivo Variable', Arial, sans-serif; display: grid; place-items: center; min-height: 100vh; padding: 24px; }
  main { max-width: 520px; border: 1.5px solid var(--ink); outline: 1px solid var(--ink); outline-offset: 3px; background: #fbfcf8; padding: 28px 26px; }
  p.lede { margin: 0; font: italic 420 17px/1.3 'Source Serif 4 Variable', Georgia, serif; color: var(--water-ink); }
  h1 { margin: 6px 0 10px; font-weight: 700; font-stretch: 125%; font-size: 34px; line-height: 1.05; letter-spacing: 0.1em; text-transform: uppercase; }
  p { margin: 0 0 18px; color: var(--ink-2); }
  nav { display: flex; gap: 10px; flex-wrap: wrap; }
  a { display: inline-flex; align-items: center; min-height: 44px; padding: 10px 18px; border: 1.5px solid var(--ink); color: var(--ink); text-decoration: none; font-weight: 680; font-stretch: 80%; font-size: 13.5px; letter-spacing: 0.16em; text-transform: uppercase; }
  a:first-child { background: var(--ink); color: var(--paper); }
  a:hover { background: var(--overprint); border-color: var(--overprint); color: #fff; }
</style>
<script src="/assets/analytics.js" defer></script>
</head>
<body>
<main>
  <p class="lede">This page isn’t on the map</p>
  <h1>Off the sheet</h1>
  <p>The address doesn’t match a page here. The game and the country pages are one tap away.</p>
  <nav><a href="/">Play World Survey</a><a href="/learn/">Learn</a><a href="/countries/">Countries</a><a href="/lists/">Lists</a><a href="/sitemap/">Site map</a></nav>
</main>
</body>
</html>
