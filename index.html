<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>World Survey · a 3D geography game</title>
<meta name="description" content="Find countries, pin capitals and match flags on a 3D relief globe. Free, no sign-up, and your map of the world fills in as you learn it.">
<meta name="theme-color" content="#f4f5f0">
<meta name="color-scheme" content="light">
<link rel="canonical" href="https://geography.aimantas.com/">
<meta property="og:type" content="website">
<meta property="og:title" content="World Survey · a 3D geography game">
<meta property="og:description" content="Find countries, pin capitals and match flags on a 3D relief globe. Your map of the world fills in as you learn it.">
<meta property="og:url" content="https://geography.aimantas.com/">
<meta property="og:image" content="https://geography.aimantas.com/assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preload" href="/assets/fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>

<link rel="preload" href="/data/world.json" as="fetch" crossorigin>

<body>
<!--
THESIS: The globe is a hand-shaded relief survey and you answer by putting your finger on the land; it refuses the quiz-card grid with a flag on top and the glowing space Earth.
OWN-WORLD: Survey map sheet: cool map paper, ink, zebra neatline with ticks, ruled title block, hypsometric relief, water lines, dash-dot borders, magenta overprint for the player's marks, green stamp for surveyed. Archivo wide caps, Source Serif 4 italic in blue, JetBrains Mono for measures.
STORY: A player sees the world on a sheet, picks a mode, finds and pins places, sees exactly how far off they were, and watches their own map print in colour country by country.
FIRST VIEWPORT: Full-bleed sheet. Relief globe right of centre at ~80% of height; title block bottom-left holds today's expedition and the sheet index of modes; survey meter top-right; scale bar and coordinates bottom-right. Primary action: Start expedition.
FORM: Survey Relief Atlas, grounded candidate 4 of 7, seed a0a56610.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->
<div class="sheet" id="sheet">
  <div class="neatline" aria-hidden="true">
    <div class="neatline__zebra"></div>
    <span class="neatline__coord neatline__coord--tl" data-coord="tl"></span>
    <span class="neatline__coord neatline__coord--br" data-coord="br"></span>
  </div>

  <div class="globe-stage" id="globe-stage" aria-label="Interactive globe"></div>
  <div class="globe-fallback" id="globe-fallback" hidden>
    <p>This game needs WebGL to draw the globe. Try another browser, or turn on hardware acceleration.</p>
  </div>

  <header class="masthead">
    <a class="wordmark" href="/" aria-label="World Survey home">
      <svg class="wordmark__mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="12.5"/><path d="M3.5 16h25M16 3.5c-4 3.6-6 7.8-6 12.5s2 8.9 6 12.5M16 3.5c4 3.6 6 7.8 6 12.5s-2 8.9-6 12.5"/><path class="wordmark__tri" d="M16 11.5l3.6 6.3h-7.2z"/></svg>
      <span class="wordmark__text">World Survey</span>
    </a>
    <nav class="masthead__nav" aria-label="Sections">
      <a href="/learn/" data-nav="learn">Learn</a>
      <a href="/atlas/" data-nav="atlas">Atlas</a>
      <a href="/countries/">Countries</a>
      <a href="/medals/" data-nav="medals">Medals</a>
      <a href="/about/" data-nav="about">About</a>
    </nav>
    <div class="masthead__tools">
      <button class="compass compass--mini" id="compass-mini" type="button" aria-label="Compass. Press to turn the map north up."></button>
      <a class="meter" href="/medals/" id="meter" aria-label="Countries surveyed">
        <span class="meter__label">Surveyed</span>
        <span class="meter__value"><b id="meter-count">0</b> / <span id="meter-total">195</span></span>
        <span class="meter__bar" id="meter-bar" aria-hidden="true"></span>
      </a>
      <button class="icon-btn" id="sound-btn" type="button" aria-pressed="true" aria-label="Sound on">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="i-speaker" d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z"/><path class="i-wave" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11"/><path class="i-off" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
      </button>
    </div>
  </header>

  <main class="titleblock" id="panel" tabindex="-1"></main>

  <aside class="marginalia" aria-label="Map margin">
    <div class="legend" aria-hidden="true">
      <div><svg viewBox="0 0 22 12"><circle cx="11" cy="6" r="4.5" fill="none" stroke="#c3177b" stroke-width="1.6"/><path d="M11 0v12M5 6h12" stroke="#c3177b" stroke-width="1.2"/></svg>Your mark</div>
      <div><svg viewBox="0 0 22 12"><path d="M11 1.5l5 9H6z" fill="#1b232b"/></svg>Capital</div>
      <div><svg viewBox="0 0 22 12"><rect x="1" y="1" width="20" height="10" fill="#fbfcf8" stroke="#1b232b" stroke-width="1.4"/><path d="M3 11l8-10M9 11l8-10M15 11l6-7.5" stroke="#1b232b" stroke-width="0.9"/></svg>Answer</div>
      <div><svg viewBox="0 0 22 12"><path d="M1 6h6M9 6h1.5M12.5 6h6" stroke="#5b3654" stroke-width="1.4"/></svg>Boundary</div>
    </div>
    <div class="marginalia__row">
      <button class="marginalia__scales" id="units-btn" type="button" aria-label="Distances in kilometres. Press to switch.">
        <span class="scalebar">
          <span class="scalebar__bar" id="scalebar-bar"><i></i><i></i><i></i><i></i></span>
          <span class="scalebar__labels"><span>0</span><span id="scalebar-km">1,000 km</span></span>
        </span>
        <span class="marginalia__scale" id="map-scale">1 : 40 000 000</span>
      </button>
      <button class="compass" id="compass" type="button" aria-label="Compass. Press to turn the map north up."></button>
    </div>
  </aside>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <div class="sr-only" id="live" role="status" aria-live="polite"></div>
</div>

<noscript><p class="noscript">World Survey is a game and needs JavaScript.</p></noscript>
<script src="/vendor/topojson/topojson-client.min.js"></script>
<script type="importmap">
{ "imports": { "three": "/vendor/three/three.module.min.js" } }
</script>
<script type="module" src="/src/main.js"></script>
</body>
</html>
